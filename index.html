<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CYBER-OS · 张书贤的个人主机</title>
  <meta name="description" content="张书贤的个人网站：作品集、技能树、未探索地图与学习手账。一台会一直长大的赛博电脑。" />
  <meta name="theme-color" content="#080b12" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%96%A5%EF%B8%8F%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="assets/css/os.css" />
</head>
<body>

  <!-- ================= 开机自检 ================= -->
  <div class="boot" id="boot">
    <pre class="boot__log" id="boot-log"></pre>
    <div class="boot__hint" id="boot-hint">按任意键跳过自检 ···</div>
  </div>

  <!-- ================= 桌面 ================= -->
  <div class="os" id="os" hidden>
    <div class="os__scanlines" aria-hidden="true"></div>

    <main class="desk" id="desk">
      <div class="desk__hint" id="desk-hint">
        <strong>CYBER-OS v0.1.0</strong><br />
        单击图标打开窗口 · 拖动标题栏移动 · 有些东西藏得很深
      </div>
      <div class="icons" id="icons"></div>
    </main>

    <div class="windows" id="windows"></div>

    <div class="startmenu" id="startmenu" hidden></div>

    <footer class="taskbar">
      <button class="taskbar__start" id="start" type="button">▚ CYBER-OS</button>
      <div class="taskbar__tasks" id="tasks"></div>
      <div class="taskbar__tray">
        <button class="taskbar__chip" id="version-chip" type="button" title="查看更新日志">v0.1.0</button>
        <span class="taskbar__clock" id="clock">--:--:--</span>
      </div>
    </footer>
  </div>

  <noscript><div class="fallback">这台电脑需要启用 JavaScript 才能开机。</div></noscript>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/views.js"></script>
  <script src="assets/js/os.js"></script>
  <script src="assets/js/secret.js"></script>
</body>
</html>
