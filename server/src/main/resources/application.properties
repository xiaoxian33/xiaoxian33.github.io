spring.application.name=site-server

# ===== 本地私有配置 =====
# 这个文件里放数据库密码，它不会进仓库（.gitignore 已排除）
# 如果文件不存在，应用照样能启动，只是连不上数据库
spring.config.import=optional:classpath:application-local.properties

# ===== 数据库连接 =====
spring.datasource.url=jdbc:mysql://localhost:3306/site_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
spring.datasource.username=root

# ===== JPA =====
# update：启动时自动根据实体类建表 / 补字段（学习阶段很方便）
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# 把 JPA 生成的 SQL 打印到控制台 —— 学习用，能亲眼看到"它到底发了什么语句"
spring.jpa.show-sql=true

# 让响应明确声明 UTF-8（否则某些命令行工具会把中文显示成乱码；浏览器一般没问题）
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# ===== 站长密码 =====
# 真正的密码不写在这里！它在本地文件 application-local.properties 里：
#   app.owner.password=你的密码
# （那个文件已被 .gitignore 排除，不会上传到 GitHub）
app.owner.password=

# ===== 图片上传 =====
# 上传的图片存哪个目录（相对 server 目录；也可以改成绝对路径，例如 D:/site-uploads）
# 注意：这个目录【不进 git 仓库】—— 它是运行时产生的，会越来越多（见 server/.gitignore）
app.upload-dir=uploads

# 单个文件的上传上限（真正对外的限制是 5MB，写在 UploadController 里，
# 这样超了能返回一句人话；这里放到 6MB 是留一点余量，避免 Spring 先报错）
spring.servlet.multipart.max-file-size=6MB

# 一次请求的总大小（前端一次选好几张图时用得上）
spring.servlet.multipart.max-request-size=30MB
